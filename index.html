<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chris Booster - Dépôt d'abord</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f172a;color:white}
header{background:linear-gradient(90deg,#0084FF,#7c3aed);padding:20px;text-align:center}
.card{background:#1e293b;margin:12px;border-radius:16px;padding:16px;border:1px solid #334155}
.platform{display:flex;gap:8px;margin:10px 0}
.p-btn{flex:1;padding:10px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:white;cursor:pointer;font-weight:bold}
.p-btn.active{background:#0084FF;border-color:#0084FF}
.service{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.s-btn{padding:12px;border-radius:10px;border:1px solid #334155;background:#1e293b;color:white;cursor:pointer}
.s-btn.active{background:#22c55e;border-color:#22c55e}
label{font-size:13px;color:#94a3b8;margin-top:10px;display:block;text-align:left}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:white;margin-top:5px}
.price-box{background:#0f172a;border:2px solid #22c55e;border-radius:12px;padding:12px;margin:12px 0;text-align:center}
.price{font-size:28px;color:#22c55e;font-weight:bold}
.btn-pay{width:100%;padding:16px;background:#475569;border:none;border-radius:12px;color:white;font-size:16px;font-weight:bold;cursor:not-allowed;margin-top:10px;opacity:0.5}
.btn-pay.ok{background:linear-gradient(90deg,#22c55e,#16a34a);cursor:pointer;opacity:1}
.alert{background:#7f1d1d;border:1px solid #ef4444;border-radius:10px;padding:10px;font-size:12px;margin:10px 0;text-align:left;color:#fecaca}
.alert-ok{background:#14532d;border:1px solid #22c55e;color:#bbf7d0}
.bar{height:8px;background:#334155;border-radius:10px;overflow:hidden;margin:10px 0;display:none}
.bar-fill{height:100%;width:0%;background:#22c55e;transition:width 0.3s}
</style>
</head>
<body>
<header>
<h1>🚀 CHRIS BOOSTER</h1>
<p style="font-size:12px;opacity:0.8">Dépôt d'abord • Vérification avant boost</p>
</header>

<div class="card">
<b>1. Plateforme</b>
<div class="platform">
<button class="p-btn active" onclick="setPlat(this,'TikTok')">TikTok</button>
<button class="p-btn" onclick="setPlat(this,'Facebook')">Facebook</button>
<button class="p-btn" onclick="setPlat(this,'Instagram')">Insta</button>
<button class="p-btn" onclick="setPlat(this,'YouTube')">YouTube</button>
</div>

<b>2. Service</b>
<div class="service">
<button class="s-btn active" onclick="setServ(this,'Vues','1000 Vues','2000')">👁️ Vues</button>
<button class="s-btn" onclick="setServ(this,'J-aime','1000 J-aime','3500')">❤️ J'aime</button>
<button class="s-btn" onclick="setServ(this,'Commentaires','100 Comms','5000')">💬 Comms</button>
<button class="s-btn" onclick="setServ(this,'Abonnes','1000 Abonnes','8000')">👥 Abonnés</button>
</div>

<label>Lien de ta publication / profil *</label>
<input id="lien" placeholder="Colle ton lien TikTok/FB/Insta/YouTube" oninput="check()">
