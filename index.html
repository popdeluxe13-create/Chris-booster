<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chris Booster - Boostez vos réseaux</title>
<style>
body{font-family:sans-serif;margin:0;padding:0;background:#f0f2f5;color:#111;transition:0.3s}
body.dark{background:#121212;color:#fff}
header{background:#0084FF;color:white;padding:20px;text-align:center}
body.dark header{background:#000}
.container{padding:20px}
.card{background:white;padding:20px;border-radius:15px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
body.dark .card{background:#1e1e1e}
input,select,button{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:1px solid #ddd;box-sizing:border-box}
button{background:#0084FF;color:white;border:none;font-weight:bold;font-size:16px;cursor:pointer}
.top-nav{display:flex;justify-content:space-between;padding:10px 20px;background:white}
body.dark .top-nav{background:#1e1e1e}
.whatsapp-float{position:fixed;bottom:20px;right:20px;background:#25D366;color:white;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 4px 10px rgba(0,0,0,0.3);z-index:9999;text-decoration:none}
</style>
</head>
<body>

<div class="top-nav">
<span><b>Chris Booster</b></span>
<span>
<a href="#" onclick="toggleDark()" style="text-decoration:none">🌙</a> &nbsp;
<a href="#" onclick="document.getElementById('settings').style.display='block'" style="text-decoration:none">⚙️</a>
</span>
</div>

<header>
<h1 id="titre">🚀 Chris Booster</h1>
<p id="soustitre">Boostez vos pages en 1 clic</p>
</header>

<div class="container">

<div class="card">
<h3 id="label-service">Choisissez votre service</h3>
<select id="service">
<option>1000 Abonnés Facebook - $5</option>
<option>1000 J'aimes - $3</option>
<option>1000 Vues - $2</option>
</select>
<input type="text" placeholder="Collez le lien de votre page" id="lien">
<button id="btn-booster" onclick="booster()">🔥 BOOSTER MAINTENANT</button>
</div>

<!-- PARAMETRES CACHES -->
<div class="card" id="settings" style="display:none">
<h3>⚙️ Paramètres</h3>
<label>🌐 Langue</label>
<select id="langue" onchange="changerLangue()">
<option value="fr">Français</option>
<option value="en">English</option>
<option value="sw">Swahili</option>
</select>

<label>💰 Prix par 1000 abonnés ($)</label>
<input type="number" id="prix" value="5">
<button onclick="sauverPrix()">Sauvegarder Prix</button>
<button onclick="document.getElementById('settings').style.display='none'" style="background:gray">Fermer</button>
<p id="msg"></p>
</div>

<div class="card">
<h4>📞 Besoin d'aide ?</h4>
<p>Contacte-nous directement sur WhatsApp</p>
<a href="https://wa.me/243981100302"><button style="background:#25D366">💬 WhatsApp Chris</button></a>
</div>

</div>

<!-- BOUTON WHATSAPP FLOTTANT -->
<a href="https://wa.me/243981100302?text=Salut%20Chris%20je%20veux%20booster" class="whatsapp-float" target="_blank">💬</a>

<script>
// Mode sombre
function toggleDark(){
 document.body.classList.toggle('dark');
 localStorage.setItem('dark', document.body.classList.contains('dark'));
}
if(localStorage.getItem('dark')=='true') document.body.classList.add('dark');

// Prix
function sauverPrix(){
 localStorage.setItem('prixBooster', document.getElementById('prix').value);
 document.getElementById('msg').innerText = "✅ Prix sauvegardé!";
}

// Langue
function changerLangue(){
 let l = document.getElementById('langue').value;
 if(l=='en'){
  document.getElementById('titre').innerText="🚀 Chris Booster";
  document.getElementById('soustitre').innerText="Boost your pages in 1 click";
  document.getElementById('btn-booster').innerText="🔥 BOOST NOW";
 } else if(l=='sw'){
  document.getElementById('titre').innerText="🚀 Chris Booster";
  document.getElementById('soustitre').innerText="Kuza kurasa zako kwa click 1";
  document.getElementById('btn-booster').innerText="🔥 BOOST SASA";
 } else {
  document.getElementById('titre').innerText="🚀 Chris Booster";
  document.getElementById('soustitre').innerText="Boostez vos pages en 1 clic";
  document.getElementById('btn-booster').innerText="🔥 BOOSTER MAINTENANT";
 }
 localStorage.setItem('langue', l);
}

function booster(){
 let lien = document.getElementById('lien').value;
 if(lien==""){alert("Collez d'abord le lien de votre page!");return;}
 window.open("https://wa.me/243981100302?text=Je veux booster ce lien: "+lien, "_blank");
}
</script>
</body>
  </html>
